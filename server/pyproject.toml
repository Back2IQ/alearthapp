[project]
name = "tda-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "websockets>=12.0",
  "cryptography>=42.0",
  "redis>=5.0",
  "numpy>=1.26",
  "google-auth>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "fakeredis>=2.23"]
p0a = ["obspy>=1.4", "seisbench>=0.12", "numpy>=1.26"]
# pyocto is installed separately (source build on ARM); gamma as pure-Python fallback:
# pip install pyocto  OR  pip install gamma

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
