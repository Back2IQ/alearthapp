server {
    listen 80;
    server_name _;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Web App
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # WebSocket Bridge Proxy
    location /ws {
        proxy_pass http://alert2iq-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Python HTTP CORS Proxy (GDACS / AFAD)
    location /hazards {
        proxy_pass http://alert2iq-server:8001;
        proxy_set_header Host $host;
    }

    location /afad {
        proxy_pass http://alert2iq-server:8001;
        proxy_set_header Host $host;
    }

    # Trigger Ingest Endpoint
    location /trigger {
        proxy_pass http://alert2iq-server:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ping {
        proxy_pass http://alert2iq-server:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Node.js Push Notification Registration Endpoint
    location /api/ {
        proxy_pass http://alert2iq-backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
